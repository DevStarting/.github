name: 🔄 Refactor Request
description: Suggest a refactor or improvement in the code.
title: "[REFACTOR] "
labels: ["type: refactor"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Please fill in the details below to help us understand what code refactor is needed.

  - type: textarea
    id: code-part
    attributes:
      label: Part of Code to Refactor
      description: Which part of the codebase needs refactoring?
      placeholder: e.g., "The login functionality in the auth module..."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Refactoring
      description: Why do you think this part needs refactoring?
      placeholder: e.g., "The current implementation is hard to maintain..."
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact of Refactoring
      description: What would be the benefit of refactoring this code?
      placeholder: e.g., "Better maintainability, more readable code..."
    validations:
      required: false
