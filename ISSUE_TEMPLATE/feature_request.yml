name: ✨ Feature Request
description: Suggest a new feature or improvement.
title: "[FEATURE] "
labels: ["type: feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        We’d love to hear your ideas! Please fill out this template for us to understand your feature request better.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe the problem or need you want to solve with this feature.
      placeholder: e.g., "I need this feature to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Your Proposal
      description: What solution or feature would you like to see implemented?
      placeholder: e.g., "I would like a button that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there other ways to solve this problem?
      placeholder: e.g., "Other methods to implement this would be..."
    validations:
      required: false
